<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fallback title / description (remplacés dynamiquement par @unhead/vue) -->
    <title>Alexandre Coutant – Conseiller Immobilier SAFTI – Vendée</title>
    <meta name="description" content="Alexandre Coutant, conseiller immobilier indépendant SAFTI à La Roche-sur-Yon (Vendée). Estimation gratuite en ligne, accompagnement vente et achat." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph par défaut -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alexandre Coutant – Conseiller Immobilier SAFTI" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://www.coutant-immobilier-vendee.fr/images/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card par défaut -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="" />

    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Chargement non-bloquant des polices (media print + onload trick) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback pour les navigateurs sans JS -->
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- Vercel Analytics — actif uniquement sur Vercel, silencieux en local -->
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
